---
# Core Zero Trust Overlay - Minimal Deployment
# Deploys the Layer 1 (Zero Trust Overlay) minimal role set on core:
# apt_repositories -> update -> security -> journald -> ziti_controller -> ziti_router
# Excludes stepca, postgresql, and the rest of the legacy full stack (deferred).
#
# ziti_controller.yaml and ziti_router.yaml are hosts: all, -l-driven
# playbooks (see their own headers) - imported here rather than included as
# roles, matching the n150.yaml precedent. -l core is now REQUIRED at
# invocation - no longer safe to run without it, since the imported
# playbooks would otherwise target the full inventory.
#
# Usage:
#   ansible-playbook -i inventory/prod playbooks/core.yaml -l core

- name: Deploy core baseline
  hosts: core
  become: true
  tasks:
    - name: Configure APT repositories
      ansible.builtin.import_role:
        name: apt_repositories

    - name: Manual system updates
      ansible.builtin.import_tasks: ../tasks/update.yaml

    - name: Apply security hardening
      ansible.builtin.import_role:
        name: security_hardening

    - name: Configure journald
      ansible.builtin.import_role:
        name: journald

- import_playbook: ziti_controller.yaml

- import_playbook: ziti_router.yaml
