---
# Edge Stack Deployment
# Deploys complete edge stack in dependency order.
#
# ziti_controller.yaml and ziti_router.yaml are hosts: all, -l-driven
# playbooks (see their own headers) - imported here rather than included as
# roles, matching the n150.yaml precedent. -l edge is now REQUIRED at
# invocation - no longer safe to run without it, since the imported
# playbooks would otherwise target the full inventory.
#
# ziti_controller import is new this pass - heimdall now hosts a controller
# instance (zctrl2) as part of the HA cluster (see P06 Roadmap), unlike the
# prior single-controller-on-eroc-only setup where edge.yaml never touched
# ziti_controller at all.
#
# Usage:
#   ansible-playbook -i inventory/prod playbooks/edge.yaml -l edge

- name: Deploy edge baseline
  hosts: edge
  become: true
  tasks:
    - name: Configure APT repositories
      ansible.builtin.import_role:
        name: apt_repositories

    - name: Manual system updates
      ansible.builtin.import_tasks: ../tasks/update.yaml

    - name: Apply security hardening
      ansible.builtin.import_role:
        name: security_hardening

    - name: Configure journald
      ansible.builtin.import_role:
        name: journald

- import_playbook: ziti_controller.yaml

- import_playbook: ziti_router.yaml
