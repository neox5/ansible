---
# ziti_controller role - Main task orchestration
# Debian 13 Trixie only

- name: Reset PKI pending fact (per-instance, prevents leaking across loop iterations)
  ansible.builtin.set_fact:
    ziti_controller_pki_pending: false

- name: Include preflight checks
  ansible.builtin.import_tasks: preflight.yaml

- name: Include installation tasks
  ansible.builtin.import_tasks: install.yaml
  when: ziti_controller_state == 'present'

- name: Include native PKI tasks (self-signed root, generated on this host)
  ansible.builtin.include_tasks: pki_native.yaml
  when:
    - ziti_controller_state == 'present'
    - ziti_controller_pki_mode == 'native'

- name: Include external PKI tasks (root signed offline, intermediate CSR round-trip)
  ansible.builtin.include_tasks: pki_external.yaml
  when:
    - ziti_controller_state == 'present'
    - ziti_controller_pki_mode == 'external'

- name: Include shared leaf cert tasks
  ansible.builtin.include_tasks: pki_leaf.yaml
  when:
    - ziti_controller_state == 'present'
    - not (ziti_controller_pki_pending | default(false))

- name: Include configuration tasks
  ansible.builtin.include_tasks: configure.yaml
  when:
    - ziti_controller_state == 'present'
    - not (ziti_controller_pki_pending | default(false))

- name: Include database init tasks
  ansible.builtin.include_tasks: init.yaml
  when:
    - ziti_controller_state == 'present'
    - not (ziti_controller_pki_pending | default(false))

- name: Include start tasks
  ansible.builtin.include_tasks: start.yaml
  when:
    - ziti_controller_state == 'present'
    - not (ziti_controller_pki_pending | default(false))

- name: Include verification tasks
  ansible.builtin.include_tasks: verify.yaml
  when:
    - ziti_controller_state == 'present'
    - not (ziti_controller_pki_pending | default(false))

- name: Include removal tasks
  ansible.builtin.import_tasks: remove.yaml
  when: ziti_controller_state == 'absent'
