- name: Stop ziti-controller instance service
  ansible.builtin.systemd:
    name: "ziti-controller@{{ ziti_controller_id }}"
    state: stopped
  failed_when: false

- name: Disable ziti-controller instance service
  ansible.builtin.systemd:
    name: "ziti-controller@{{ ziti_controller_id }}"
    enabled: false
  failed_when: false

# Package purge/repo/keyring removal tasks unchanged - host-level, not
# instance-level; only ever actually removes anything on the last instance's
# run in practice, harmless no-op otherwise.

- name: Remove instance config file
  ansible.builtin.file:
    path: "{{ ziti_controller_config_file }}"
    state: absent

- name: Remove instance service environment file
  ansible.builtin.file:
    path: "{{ ziti_controller_service_env }}"
    state: absent

# ... Level 2 (remove_data) tasks: signing CA, leaf certs, database -
# unchanged, already correctly scoped via ziti_controller_pki_dir/db_dir.

# ---------------------------------------------------------------------------
# Level 3 — root CA + system account removal
# ---------------------------------------------------------------------------

# ... existing root CA removal + confirmation gate tasks unchanged ...

- name: Deregister this instance and remove shared account if last
  ansible.builtin.include_role:
    name: ziti_instance_registry
    tasks_from: check_and_remove.yaml
  vars:
    ziti_instance_role: controller
    ziti_instance_id: "{{ ziti_controller_id }}"
    ziti_instance_system_user: "{{ ziti_controller_system_user }}"
    ziti_instance_system_group: "{{ ziti_controller_system_group }}"
  when: ziti_controller_remove_root_ca | bool
