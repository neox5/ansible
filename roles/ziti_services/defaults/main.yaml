---
# ziti_services role defaults.
#
# Declarative source of truth lives in inventory
# (e.g. inventory/prod/group_vars/site_zion/ziti_services.yaml).
# Empty lists here make the role safe to include even when no
# service/config declarations are present for a given run.

ziti_shared_configs: []
ziti_services: []

# CLI login target - any one controller is sufficient (non-leader members
# forward writes to the leader automatically). Host-specific, set in
# host_vars/eroc/ziti_controller.yaml - not shared at site level like
# ziti_ctrl_endpoints, since only eroc runs the ziti CLI.
ziti_ctrl_login_address: ""
ziti_ctrl_login_port: 1280
